</b>, the <b>design traffic</b> (gross weight and axle loads), the <b>deflection limit</b> (e.g. L/500), the maximum <b>gradient</b>, any <b>clearance zones</b> and the <b>budget</b>.","The <b>Engineering concept</b> box tells you what the project is teaching."]},{ch:"2",title:"Understand the site",steps:["The <b>red triangles</b> are anchors — fixed foundations. The road on each bank ends at an anchor.","The dashed rectangle is the area you may build in. Orange hatched zones (on some projects) must stay empty.","Navigate with two-finger scroll to pan, pinch or <kbd>⌘</kbd>+scroll to zoom, and <kbd>R</kbd> to recentre."]},{ch:"3",title:"Choose the road deck",steps:["Click <b>deck</b> in the Tools panel (or press <kbd>1</kbd>). Vehicles can only drive on deck members.","Pick a section in the left panel. Each row shows weight, cost per metre, tension capacity <b>T</b> and compression capacity <b>C@3m</b>.","<b>Timber plank</b> is light and cheap; steel and concrete decks are stiffer but heavier and dearer."]},{ch:"4",title:"Build the deck",steps:["<b>Drag</b> from the left anchor to place a member. Release to build it; a new joint appears at the end.","Deck panels are at most 3 m long, so build it joint to joint (e.g. five 2 m panels on a 10 m span) until you reach the right anchor.","Hold <kbd>Shift</kbd> to place off-grid. <b>Right-click</b> deletes; <kbd>⌘Z</kbd> undoes.","Watch the right panel: a deck alone sags like a rope and the <b>deflection</b> check turns red."]},{ch:"5",title:"Choose a structural material",steps:["<b>Timber</b> (<kbd>2</kbd>): cheap and light, but buckles sooner. <b>Steel</b> (<kbd>3</kbd>): strong, stiff, longer reach. <b>Cable</b> (<kbd>4</kbd>): very strong but tension only — it goes slack if pushed.","Choose the section before you draw; you can change it later."]},{ch:"6",title:"Make triangles",steps:["From each deck joint, drag down (or up) about 1.5 m to make <b>V shapes</b>, then join the new points into a bottom (or top) chord.","Pi           </div>
          <button class="icon toggle" id="labelsBtn" title="Value labels (N)"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h7" /></svg></button>
          <button class="icon toggle" id="shapeBtn" title="Deflected shape (D)"><svg viewBox="0 0 24 24"><path d="M3 8h18" stroke-dasharray="2 2" /><path d="M3 8c5 8 13 8 18 0" /></svg></button>
          <button class="icon toggle" id="gridBtn" title="Snap to grid (G)"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 12h16M12 4v16" /></svg></button>
          <button class="icon toggle" id="soundBtn" title="Sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11" /></svg></button>
          <button class="icon" id="helpBtn" title="Handbook (?)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .7-1.5 1.2-1.5 2.5M12 17h.01" /></svg></button>
        </div>
      </header>

      <aside class="panel left" id="leftPanel">
        <section>
          <h4>Tools</h4>
          <div class="tools" id="tools"></div>
        </section>
        <section>
          <h4 id="sectionTitle">Section</h4>
          <div class="sections" id="sections"></div>
          <p class="muted tiny" id="sectionNote"></p>
        </section>
        <section class="legend" id="legend"></section>
      </aside>

      <aside class="panel right" id="rightPanel">
        <section id="objectivesSec">
          <h4>Design checks <span class="pill" id="checkPill"></span></h4>
          <div id="checks" class="checks"></div>
        </section>
        <section id="inspectorSec">
          <h4>Inspector</h4>
          <div id="inspector" class="inspector"></div>
        </section>
        <section id="playgroundSec" class="hidden">
          <h4>Playground</h4>
          <div id="playground"></div>
        </section>
      </aside>

      <div class="simbar" id="simbar">
        <button class="sb-btn" id="pauseBtn" title="Pause (P)"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" /><rect x="14" y="5" width="4" height="14" rx="1" /></svg></button>
        <button class="sb-btn" id="stepBtn" title="Step one frame (.)"><svg viewBox="0 0 24 24"><path d="M6 5v14l9-7z" /><rect x="16" y="5" width="3" height="14" rx="1" /></svg></button>
        <button class="sb-btn speed" id="speedBtn" title="Simulation speed (F)">1×</button>
        <button class="sb-btn" id="followBtn" title="Camera follows traffic (C)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /></svg></button>
        <div class="sb-time" id="simTime">Design mode</div>
        <button id="playBtn" class="play" title="Run the load test (Space)">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M7 4.5v15l13-7.5z" /></svg>
          <svg viewBox="0 0 24 24" class="i-stop"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
          <span id="playLabel">Load test</span>
        </button>
      </div>

      <div class="zoombar" id="zoombar">
        <button id="zoomIn" title="Zoom in (+)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg></button>
        <div class="zoomval" id="zoomVal" title="Zoom level — click to reset">100%</div>
        <button id="zoomOut" title="Zoom out (−)"><svg viewBox="0 0 24 24"><path d="M5 12h14" /></svg></button>
        <button id="zoomFit" title="Fit bridge to view (R)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg></button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="tooltip" id="tooltip"></div>
      <div class="toast" id="toast"></div>

      <div class="overlay hidden" id="modal"><div class="card" id="modalCard"></div></div>
      <div class="overlay hidden" id="levels"><div class="card wide"><div class="card-head"><h2>Projects</h2><button class="icon" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button></div><div class="level-grid" id="levelGrid"></div></div></div>
      <div class="overlay hidden" id="brief"><div class="card brief" id="briefCard"></div></div>
      <div class="overlay hidden" id="help"><div class="card wide" id="helpCard"></div></div>
      <div class="overlay hidden" id="walk"><div class="card walk" id="walkCard"></div></div>
    </div>
  </body>
</html>
